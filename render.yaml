# Render Blueprint — keeps app data on managed Postgres (survives Docker redeploys).
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: hari
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /up
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: LOG_CHANNEL
        value: stderr
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: hari-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: hari-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: hari-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: hari-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: hari-db
          property: password
      - key: CACHE_STORE
        value: database
      - key: SESSION_DRIVER
        value: database
      - key: QUEUE_CONNECTION
        value: database

databases:
  - name: hari-db
    plan: free
    databaseName: hari
    user: hari
