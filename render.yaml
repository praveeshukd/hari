# Render Blueprint — Free web + SQLite (dummy/demo data; wiped on each redeploy).
# Docs: https://render.com/docs/blueprint-spec
# No managed Postgres. Delete any existing free DB (e.g. hari-db) in the Render dashboard.
services:
  - type: web
    name: hari
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /up
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: LOG_CHANNEL
        value: stderr
      - key: DB_CONNECTION
        value: sqlite
      - key: CACHE_STORE
        value: database
      - key: SESSION_DRIVER
        value: database
      - key: QUEUE_CONNECTION
        value: database
